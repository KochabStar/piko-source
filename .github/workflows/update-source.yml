name: Update upstream packages

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated package names; empty checks all packages"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: source-updates
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Validate baseline
        run: |
          node scripts/check.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
      - name: Discover, download and verify upstream changes
        id: update
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_PACKAGES: ${{ inputs.packages }}
        run: node scripts/update.mjs --write
      - name: Validate generated catalog
        run: |
          $env:BASE_SHA = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
      - name: Open or refresh the reviewed update PR
        if: steps.update.outputs.changed_count != '' && steps.update.outputs.changed_count != '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.SOURCE_UPDATE_TOKEN || github.token }}
          add-paths: |
            index.json
            packages/**
          branch: automation/upstream-updates
          base: ${{ github.event.repository.default_branch }}
          commit-message: "chore(source): add verified upstream versions"
          title: "chore(source): update verified upstream packages"
          body-path: update-report.md
          delete-branch: true
      - name: Report blocked upstreams or updater failure
        if: always() && steps.update.outcome == 'failure'
        run: |
          Write-Error 'Some upstream updates were blocked. Read the job summary. Valid candidates, when present, are preserved in the update PR.'
          exit 1
